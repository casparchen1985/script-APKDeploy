# =============================================================================
# devices.conf — 機種 Repo 路徑與目錄結構設定
# 新增機種只需在此加一行，腳本無需修改
# 路徑可使用 ~ （腳本在 upload server 上執行，~ 會正確展開）
# =============================================================================

DEVICE_rk26s="~/rk26s/LA.QSSI.12.0"
DEVICE_rk26u="~/rk26plus/LA.QSSI.14.0.R1"
DEVICE_rs35q="~/rs35"
DEVICE_rs35r="~/rs35r"
DEVICE_rs36s="~/rs36s/LA.QSSI.12.0"
DEVICE_rs36u="~/rs36plus/LA.QSSI.14.0.R1"
DEVICE_rs38t="~/rs38t/titan_qssi13"
DEVICE_rs38v="~/rs38v/titan_qssi15"
DEVICE_rk95p="~/rk95"
DEVICE_rk95s="~/rk95s"
DEVICE_rk95u="~/rk95u"
DEVICE_rk96v="~/rk96v/LA.QSSI.15.0"

# -----------------------------------------------------------------------------
# APK 放置目錄（相對於各 repo 根目錄）
#
# APK_SUBDIR               全域預設值，所有機種共用
# DEVICE_<NAME>_APK_SUBDIR 機種專屬覆寫，僅該機種生效；未設定則使用全域預設
#
# 範例：特定機種使用不同目錄
#   DEVICE_rk25_APK_SUBDIR="android/vendor/cipherlab/prebuilt/rk25"
#   *rk25 為機種範例，僅供格式參考
# -----------------------------------------------------------------------------
APK_SUBDIR="vendor/cipherlab"

# 機種專屬 APK 目錄覆寫（有需要才取消註解並填入）
# DEVICE_rk26u_APK_SUBDIR="vendor/cipherlab"
# DEVICE_rs36s_APK_SUBDIR="vendor/cipherlab"
# DEVICE_rs38t_APK_SUBDIR="vendor/cipherlab"
# DEVICE_rk95s_APK_SUBDIR="vendor/cipherlab"
# DEVICE_rk96v_APK_SUBDIR="vendor/cipherlab"

# -----------------------------------------------------------------------------
# APK 暫存目錄：與腳本同層的 toBeUpload/ 資料夾
# 腳本自動以 SCRIPT_DIR 定位，無需手動修改此路徑
# 部署成功的 APK 自動刪除；失敗或未使用的保留，方便重試
APK_STAGING_DIR=""  # 留空 = 自動使用 <SCRIPT_DIR>/toBeUpload/
